<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة الاشتراكات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
          },
          fontFamily: { sans: ['Tajawal', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/80 z-[9999] flex items-center justify-center flex-col pointer-events-none" style="display:flex;">
    <div class="w-10 h-10 border-4 border-gray-200 border-t-primary-600 rounded-full animate-spin"></div>
    <p class="mt-3 text-sm text-gray-500">جاري التحميل...</p>
  </div>

  <!-- Mobile Header -->
  <header class="lg:hidden fixed top-0 right-0 left-0 bg-white border-b z-50 px-4 py-3 flex items-center justify-between shadow-sm">
    <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="text-lg font-bold text-primary-600 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>الإشتراكات</h1>
    <div class="w-10"></div>
  </header>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="lg:hidden fixed inset-0 bg-black/40 z-40 hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-0 right-0 bottom-0 w-64 bg-gray-900 text-white z-50 transform transition-transform duration-300 lg:translate-x-0 translate-x-full shadow-xl flex flex-col">
    <div class="p-5 border-b border-gray-700 flex items-center justify-between">
      <h2 class="text-lg font-bold flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>الإشتراكات</h2>
      <button onclick="toggleSidebar()" class="lg:hidden p-1 hover:bg-gray-700 rounded text-gray-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto py-2">
      <ul>
        <li data-page="dashboard" onclick="navigateTo('dashboard')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent active-nav">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>الرئيسية</span>
        </li>
        <li data-page="subscriptions" onclick="navigateTo('subscriptions')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>الاشتراكات</span>
        </li>
        <li data-page="customers" onclick="navigateTo('customers')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>العملاء</span>
        </li>
        <li data-page="plans" onclick="navigateTo('plans')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg><span>خطط الاشتراك</span>
        </li>
        <li data-page="payments" onclick="navigateTo('payments')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg><span>المدفوعات</span>
        </li>
        <li data-page="coupons" onclick="navigateTo('coupons')" class="flex items-center gap-3 px-5 py-3 cursor-pointer text-gray-300 hover:bg-gray-800 hover:text-white transition border-r-[3px] border-transparent">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg><span>كوبونات الخصم</span>
        </li>
      </ul>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button onclick="showSetupPage()" class="w-full text-sm px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg transition text-gray-300 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>الإعدادات
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="main-content" class="lg:mr-64 mr-0 pt-16 lg:pt-0 min-h-screen p-4 md:p-6 transition-all">

    <!-- Dashboard -->
    <section id="page-dashboard" class="page active"></section>

    <!-- Plans -->
    <section id="page-plans" class="page hidden"></section>

    <!-- Subscriptions -->
    <section id="page-subscriptions" class="page hidden"></section>

    <!-- Customers -->
    <section id="page-customers" class="page hidden"></section>

    <!-- Payments -->
    <section id="page-payments" class="page hidden"></section>

    <!-- Coupons -->
    <section id="page-coupons" class="page hidden"></section>

  </main>

  <!-- Modal -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-[1000] hidden items-center justify-center backdrop-blur-sm p-4" onclick="closeModal(event)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[2000] flex flex-col gap-2"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
